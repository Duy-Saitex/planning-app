<title>Saitex Line Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ================================================================
   Design system: the sx tokens from the Saitex tech-pack workbench.
   Light is the base :root; both dark paths redefine tokens only.
   ================================================================ */
:root{
  /* palette (fixed in both themes) */
  --sx-orange-3:#C87619;
  /* geometry */
  --sx-font-sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --sx-font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sx-radius-control:4px; --sx-radius-badge:2px;
  --sx-control-height:30px; --sx-control-height-compact:24px;
  --sx-topbar-height:40px; --sx-toolbar-height:40px; --sx-row-height:30px;
  --sx-sidebar-width:240px;
  --sx-ease-out:cubic-bezier(0.4,1,0.75,0.9); --sx-duration-state:100ms; --sx-duration-layer:150ms;
  /* light surfaces */
  --sx-surface-sunken:#EDEFF2; --sx-surface-base:#FFFFFF; --sx-surface-raised:#F6F7F9;
  --sx-surface-hover:#F6F7F9; --sx-surface-active:#E5E8EB;
  --sx-surface-selected:rgba(45,114,210,.14); 
  --sx-border-subtle:#E5E8EB; --sx-border-default:#D3D8DE; --sx-border-strong:#ABB3BF; --sx-border-control:#8F99A8;
  --sx-text-primary:#1C2127; --sx-text-secondary:#5F6B7C; --sx-text-disabled:#8F99A8;
  --sx-text-on-primary:#FFFFFF; --sx-text-link:#215DB0;
  --sx-intent-primary:#2D72D2; --sx-intent-primary-hover:#215DB0;
  --sx-intent-success:#238551; --sx-intent-warning:#C87619; --sx-intent-danger:#CD4246;
  --sx-text-success:#1C6E42; --sx-text-warning:#935610; --sx-text-danger:#AC2F33;
  --sx-tint-primary:rgba(45,114,210,.12); --sx-tint-success:rgba(35,133,81,.13);
  --sx-tint-warning:rgba(200,118,25,.14); --sx-tint-danger:rgba(205,66,70,.13);
  --sx-shadow-layer:0 2px 4px rgba(17,20,24,.2),0 8px 24px rgba(17,20,24,.2);
  /* stage ramp: one hue, cutting (pale) to ex-factory (deep) */
  --st1:#74A9F5; --st2:#5A97EE; --st3:#4C90F0; --st4:#2D72D2; --st5:#215DB0; --st6:#12386F;
  --st1-ink:#0D203C; --st2-ink:#0D203C; --st3-ink:#0B1B33; --st4-ink:#FFFFFF; --st5-ink:#FFFFFF; --st6-ink:#FFFFFF;
  --grid-line:#E5E8EB; --sunday:#DDE1E7; --edit:#935610; --edit-tint:rgba(200,118,25,.14);
  --run-go:#1C6E42; --run-ready:#935610;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sx-surface-sunken:#111418; --sx-surface-base:#1C2127; --sx-surface-raised:#252A31;
    --sx-surface-hover:#252A31; --sx-surface-active:#2F343C;
    --sx-surface-selected:rgba(45,114,210,.20); 
    --sx-border-subtle:#2F343C; --sx-border-default:#383E47; --sx-border-strong:#5F6B7C; --sx-border-control:#8F99A8;
    --sx-text-primary:#F6F7F9; --sx-text-secondary:#ABB3BF; --sx-text-disabled:#738091;
    --sx-text-on-primary:#FFFFFF; --sx-text-link:#8ABBFF;
    --sx-text-success:#72CA9B; --sx-text-warning:#FBB360; --sx-text-danger:#FA999C;
    --sx-tint-primary:rgba(45,114,210,.20); --sx-tint-success:rgba(114,202,155,.15);
    --sx-tint-warning:rgba(251,179,96,.15); --sx-tint-danger:rgba(205,66,70,.20);
      --sx-shadow-layer:0 2px 4px rgba(17,20,24,.4),0 10px 30px rgba(17,20,24,.6);
    --st1:#215DB0; --st2:#2D72D2; --st3:#4C90F0; --st4:#6BA5F5; --st5:#8ABBFF; --st6:#B4D3FF;
    --st1-ink:#FFFFFF; --st2-ink:#FFFFFF; --st3-ink:#0B1B33; --st4-ink:#0B1B33; --st5-ink:#0B1B33; --st6-ink:#0B1B33;
    --grid-line:#252A31; --sunday:#1A1F26; --edit:#FBB360; --edit-tint:rgba(251,179,96,.15);
  --run-go:#72CA9B; --run-ready:#FBB360;
    --run-go:#72CA9B; --run-ready:#FBB360;
  }
}
:root[data-theme="dark"]{
  --sx-surface-sunken:#111418; --sx-surface-base:#1C2127; --sx-surface-raised:#252A31;
  --sx-surface-hover:#252A31; --sx-surface-active:#2F343C;
  --sx-surface-selected:rgba(45,114,210,.20); 
  --sx-border-subtle:#2F343C; --sx-border-default:#383E47; --sx-border-strong:#5F6B7C; --sx-border-control:#8F99A8;
  --sx-text-primary:#F6F7F9; --sx-text-secondary:#ABB3BF; --sx-text-disabled:#738091;
  --sx-text-on-primary:#FFFFFF; --sx-text-link:#8ABBFF;
  --sx-text-success:#72CA9B; --sx-text-warning:#FBB360; --sx-text-danger:#FA999C;
  --sx-tint-primary:rgba(45,114,210,.20); --sx-tint-success:rgba(114,202,155,.15);
  --sx-tint-warning:rgba(251,179,96,.15); --sx-tint-danger:rgba(205,66,70,.20);
  --sx-shadow-layer:0 2px 4px rgba(17,20,24,.4),0 10px 30px rgba(17,20,24,.6);
  --st1:#215DB0; --st2:#2D72D2; --st3:#4C90F0; --st4:#6BA5F5; --st5:#8ABBFF; --st6:#B4D3FF;
  --st1-ink:#FFFFFF; --st2-ink:#FFFFFF; --st3-ink:#0B1B33; --st4-ink:#0B1B33; --st5-ink:#0B1B33; --st6-ink:#0B1B33;
  --grid-line:#252A31; --sunday:#1A1F26; --edit:#FBB360; --edit-tint:rgba(251,179,96,.15);
  --run-go:#72CA9B; --run-ready:#FBB360;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sx-surface-sunken);color:var(--sx-text-primary);
  font-family:var(--sx-font-sans);font-size:14px;line-height:1.286;-webkit-font-smoothing:antialiased;
  overflow:hidden;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;font-family:inherit}
:focus-visible{outline:2px solid var(--sx-intent-primary);outline-offset:2px}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sx-border-default);border:3px solid transparent;background-clip:content-box;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--sx-border-strong);background-clip:content-box;border:3px solid transparent}
.mono{font-family:var(--sx-font-mono);font-variant-numeric:tabular-nums}
.sm{font-size:12px}
.muted{color:var(--sx-text-secondary)}
.hidden{display:none!important}

/* ---------------- shell ---------------- */
#app{display:grid;grid-template-rows:var(--sx-topbar-height) 1fr;height:100dvh}
.topbar{display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;background:var(--sx-surface-base);
  border-bottom:1px solid var(--sx-border-default);position:relative;z-index:40}
.brand{display:flex;align-items:center;gap:8px;flex:none;font-size:12px;font-weight:600;letter-spacing:.02em}
.brand .mark{width:3px;height:14px;background:var(--sx-intent-primary);display:block}
.brand .sep{color:var(--sx-text-disabled)}
.filechip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sx-text-secondary);height:24px;
  padding:0 8px;border-radius:var(--sx-radius-control);max-width:250px;border:1px solid transparent}
.filechip:hover{background:var(--sx-surface-hover);border-color:var(--sx-border-subtle);color:var(--sx-text-primary)}
.filechip .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--sx-font-mono);font-size:12px}
.filechip.sample{color:var(--sx-text-warning)}
#openbtn{flex:none}
button.tag{cursor:pointer;border:1px solid transparent}
button.tag:hover{border-color:currentColor}
.tabs{display:flex;gap:0;margin-left:8px}
.tabs button{height:var(--sx-topbar-height);padding:0 12px;font-size:12px;font-weight:500;color:var(--sx-text-secondary);
  border-bottom:2px solid transparent;letter-spacing:.02em;white-space:nowrap;
  transition:color var(--sx-duration-state) var(--sx-ease-out)}
.tabs button[aria-selected="true"]{color:var(--sx-text-primary);border-bottom-color:var(--sx-intent-primary);font-weight:600}
.tabs button:hover{color:var(--sx-text-primary);background:var(--sx-surface-hover)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:6px;background:var(--sx-surface-raised);border:1px solid var(--sx-border-default);
  border-radius:var(--sx-radius-control);padding:0 8px;height:var(--sx-control-height-compact);min-width:200px}
.search:focus-within{border-color:var(--sx-intent-primary);box-shadow:0 0 0 1px var(--sx-intent-primary)}
.search input{background:none;border:0;outline:none;width:100%;font-size:12px}
.search input::placeholder{color:var(--sx-text-disabled)}
.btn{display:inline-flex;align-items:center;gap:6px;height:var(--sx-control-height-compact);padding:0 8px;
  border-radius:var(--sx-radius-control);border:1px solid var(--sx-border-default);background:var(--sx-surface-raised);
  font-size:12px;font-weight:500;color:var(--sx-text-primary);white-space:nowrap;
  transition:background-color var(--sx-duration-state) var(--sx-ease-out)}
.btn:hover{background:var(--sx-surface-active);border-color:var(--sx-border-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:var(--sx-surface-raised);border-color:var(--sx-border-default)}
.btn.primary{background:var(--sx-intent-primary);border-color:var(--sx-intent-primary);color:var(--sx-text-on-primary);font-weight:600}
.btn.primary:hover{background:var(--sx-intent-primary-hover);border-color:var(--sx-intent-primary-hover)}
.btn.icon{padding:0;width:var(--sx-control-height-compact);justify-content:center;font-size:13px}
.btn.tall{height:var(--sx-control-height);padding:0 12px}
.editcount{font-size:11px;font-weight:600;background:var(--sx-orange-3);color:#fff;border-radius:var(--sx-radius-badge);
  padding:0 5px;min-width:16px;text-align:center;line-height:16px;font-family:var(--sx-font-mono)}
.main{display:grid;grid-template-columns:auto 1fr;min-height:0;position:relative}

/* ---------------- filter rail ---------------- */
.rail{width:var(--sx-sidebar-width);background:var(--sx-surface-base);border-right:1px solid var(--sx-border-default);
  overflow-y:auto;overscroll-behavior:contain;padding-bottom:24px;flex:none}
.rail.collapsed{width:0;border-right:0;overflow:hidden}
.railhead{position:sticky;top:0;background:var(--sx-surface-base);border-bottom:1px solid var(--sx-border-subtle);
  padding:0 12px;height:var(--sx-toolbar-height);z-index:3;display:flex;align-items:center;gap:8px}
.railhead .count{font-size:12px;font-weight:600;font-family:var(--sx-font-mono)}
.railhead .count small{font-weight:400;color:var(--sx-text-disabled)}
.clearall{margin-left:auto;font-size:12px;color:var(--sx-text-link);font-weight:500}
.clearall:hover{text-decoration:underline}
.fsec{border-bottom:1px solid var(--sx-border-subtle)}
.fsec > summary{list-style:none;cursor:pointer;padding:7px 12px;font-size:12px;font-weight:500;letter-spacing:.02em;
  color:var(--sx-text-secondary);display:flex;align-items:center;gap:6px}
.fsec > summary::-webkit-details-marker{display:none}
.fsec > summary:hover{background:var(--sx-surface-hover);color:var(--sx-text-primary)}
.fsec > summary::before{content:"";width:0;height:0;border-left:4px solid currentColor;border-top:3.5px solid transparent;
  border-bottom:3.5px solid transparent;transition:transform var(--sx-duration-state)}
.fsec[open] > summary::before{transform:rotate(90deg)}
.fsec > summary .n{margin-left:auto;color:var(--sx-text-link);font-weight:600;font-family:var(--sx-font-mono)}
.fbody{padding:2px 12px 10px}
.qgrid{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--sx-border-default);background:var(--sx-surface-raised);
  border-radius:var(--sx-radius-badge);padding:2px 7px;font-size:12px;color:var(--sx-text-secondary);line-height:16px}
.chip:hover{border-color:var(--sx-border-strong);color:var(--sx-text-primary)}
.chip[aria-pressed="true"]{background:var(--sx-tint-primary);border-color:var(--sx-intent-primary);color:var(--sx-text-link);font-weight:600}
.chip .cn{opacity:.75;font-family:var(--sx-font-mono);font-size:11px}
.facet{max-height:206px;overflow-y:auto;margin:0 -4px;padding:0 4px}
.frow{display:flex;align-items:center;gap:7px;padding:2px 4px;border-radius:var(--sx-radius-badge);cursor:pointer;
  font-size:12px;width:100%;text-align:left;min-height:22px}
.frow:hover{background:var(--sx-surface-hover)}
.frow .box{width:12px;height:12px;border:1px solid var(--sx-border-control);border-radius:2px;flex:none;position:relative}
.frow[aria-checked="true"] .box{background:var(--sx-intent-primary);border-color:var(--sx-intent-primary)}
.frow[aria-checked="true"] .box::after{content:"";position:absolute;left:3.5px;top:.5px;width:3px;height:7px;
  border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.frow .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .cnt{color:var(--sx-text-disabled);font-size:11px;font-family:var(--sx-font-mono)}
.frow .swatch{width:8px;height:8px;border-radius:2px;flex:none}
.fsearch,.inp{width:100%;background:var(--sx-surface-raised);border:1px solid var(--sx-border-default);
  border-radius:var(--sx-radius-control);padding:2px 7px;font-size:12px;outline:none;height:var(--sx-control-height-compact)}
.fsearch:focus,.inp:focus{border-color:var(--sx-intent-primary);box-shadow:0 0 0 1px var(--sx-intent-primary)}
.fsearch{margin-bottom:5px}
.daterow{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.daterow label{font-size:12px;color:var(--sx-text-secondary);width:78px;flex:none}
.daterow input{flex:1;min-width:0}
.rule{display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center;margin-bottom:5px;padding:6px;
  background:var(--sx-surface-raised);border:1px solid var(--sx-border-subtle);border-radius:var(--sx-radius-control)}
.rule select,.rule input{width:100%;background:var(--sx-surface-base);border:1px solid var(--sx-border-default);
  border-radius:var(--sx-radius-control);padding:1px 5px;font-size:12px;outline:none;min-width:0;height:24px}
.rule .row2{grid-column:1/-1;display:flex;gap:4px}
.rule .x{color:var(--sx-text-disabled);font-size:15px;line-height:1;padding:0 2px}
.rule .x:hover{color:var(--sx-intent-danger)}

/* ---------------- view frame ---------------- */
.viewwrap{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--sx-surface-sunken)}
.viewbar{display:flex;align-items:center;gap:8px;padding:0 10px;min-height:var(--sx-toolbar-height);
  border-bottom:1px solid var(--sx-border-default);background:var(--sx-surface-base);flex:none;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--sx-border-default);border-radius:var(--sx-radius-control);overflow:hidden}
.seg button{padding:0 9px;height:22px;font-size:12px;font-weight:500;color:var(--sx-text-secondary);
  border-right:1px solid var(--sx-border-default);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sx-tint-primary);color:var(--sx-text-link);font-weight:600}
.seg button:hover:not([aria-pressed="true"]){background:var(--sx-surface-hover);color:var(--sx-text-primary)}
.vlabel{font-size:12px;font-weight:500;color:var(--sx-text-disabled);letter-spacing:.02em}
.view{flex:1;min-height:0;overflow:auto;position:relative}

/* ---------------- overview ---------------- */
.ov{padding:12px;display:flex;flex-direction:column;gap:10px;max-width:1600px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--sx-border-subtle);
  border:1px solid var(--sx-border-subtle)}
.kpi{background:var(--sx-surface-base);padding:9px 12px;display:flex;flex-direction:column;gap:1px;text-align:left;cursor:pointer}
.kpi:hover{background:var(--sx-surface-hover)}
.kpi .k{font-size:12px;font-weight:500;color:var(--sx-text-secondary);letter-spacing:.02em}
.kpi .v{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.2;font-family:var(--sx-font-mono)}
.kpi .s{font-size:12px;color:var(--sx-text-disabled)}
.kpi.alert .v{color:var(--sx-text-danger)}
.kpi.warn .v{color:var(--sx-text-warning)}
.kpi.good .v{color:var(--sx-text-success)}
.masonry{columns:3 340px;column-gap:10px}
.masonry .panel{display:block;break-inside:avoid;margin:0 0 10px}
.panel{background:var(--sx-surface-base);border:1px solid var(--sx-border-subtle);display:flex;flex-direction:column;min-width:0}
.panel > header{padding:6px 12px;min-height:var(--sx-toolbar-height);border-bottom:1px solid var(--sx-border-subtle);
  display:flex;align-items:center;gap:4px 8px;flex:none;flex-wrap:wrap}
.panel > header h3{margin:0;font-size:14px;font-weight:600;letter-spacing:-.005em}
.panel > header .sub{font-size:12px;color:var(--sx-text-disabled);margin-left:auto}
.panel .body{padding:10px 12px;min-width:0;overflow-x:auto}
.funnel{display:flex;flex-direction:column;gap:5px}
.frow2{display:grid;grid-template-columns:108px 1fr 132px;gap:8px;align-items:center;font-size:12px;cursor:pointer;
  padding:2px 2px;text-align:left;width:100%}
.frow2:hover{background:var(--sx-surface-hover)}
.frow2 .nm{display:flex;align-items:center;gap:6px;font-weight:500}
.frow2 .dot{width:9px;height:9px;flex:none;border-radius:2px}
.bar{height:14px;background:var(--sx-surface-active);overflow:hidden;display:flex;min-width:40px;border-radius:2px}
.bar > i{display:block;height:100%}
.frow2 .fig{text-align:right;color:var(--sx-text-secondary);font-family:var(--sx-font-mono);font-size:12px}
.frow2 .fig b{color:var(--sx-text-primary);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sx-text-secondary);padding-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
.list{display:flex;flex-direction:column}
.lrow{display:grid;gap:8px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--sx-border-subtle);
  font-size:12px;text-align:left;width:100%;cursor:pointer}
.lrow:hover{background:var(--sx-surface-hover)}
.lrow:last-child{border-bottom:0}
.lrow .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .m{color:var(--sx-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:0 5px;line-height:16px;
  border-radius:var(--sx-radius-badge);letter-spacing:.02em;white-space:nowrap}
.tag.bad{background:var(--sx-tint-danger);color:var(--sx-text-danger)}
.tag.warn{background:var(--sx-tint-warning);color:var(--sx-text-warning)}
.tag.ok{background:var(--sx-tint-success);color:var(--sx-text-success)}
.tag.neutral{background:var(--sx-surface-active);color:var(--sx-text-secondary)}
.tag.accent{background:var(--sx-tint-primary);color:var(--sx-text-link)}
.empty{padding:28px 14px;text-align:center;color:var(--sx-text-disabled);font-size:12px}
svg text{fill:var(--sx-text-secondary);font-family:var(--sx-font-mono);font-size:10px}
svg text.val{fill:var(--sx-text-primary);font-weight:600}
svg .gridline{stroke:var(--grid-line);stroke-width:1}
svg .axis{stroke:var(--sx-border-default);stroke-width:1}
svg .caplin{stroke:var(--sx-intent-danger);stroke-width:1.5;stroke-dasharray:4 3}

/* ---------------- board ---------------- */
.board{position:relative;height:100%;display:flex;flex-direction:column;background:var(--sx-surface-base)}
.bscroll{flex:1;min-height:0;overflow:auto;position:relative}
.bgrid{position:relative;min-width:max-content}
.bhead{position:sticky;top:0;z-index:20;background:var(--sx-surface-base);border-bottom:1px solid var(--sx-border-default);display:flex}
.bhead .corner{position:sticky;left:0;z-index:2;background:var(--sx-surface-base);border-right:1px solid var(--sx-border-default);
  flex:none;display:flex;flex-direction:column;justify-content:flex-end;padding:3px 10px 4px}
.bhead .corner .t{font-size:12px;font-weight:500;color:var(--sx-text-disabled);letter-spacing:.02em}
.bhead .days{position:relative;flex:none}
.months{display:flex;height:18px;align-items:center}
.months .m{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--sx-text-disabled);
  border-left:1px solid var(--sx-border-subtle);padding-left:5px;height:100%;display:flex;align-items:center;
  overflow:hidden;white-space:nowrap}
.dayrow{display:flex;height:26px}
.dcell{flex:none;text-align:center;font-size:10px;line-height:1.1;padding-top:2px;color:var(--sx-text-disabled);
  border-left:1px solid var(--grid-line);font-family:var(--sx-font-mono)}
.dcell.sun{background:var(--sunday)}

.pop .prow.lrowdet{flex-direction:column;align-items:stretch;gap:2px;padding:5px}

input.zoom{width:110px;accent-color:var(--sx-intent-primary);height:20px;cursor:pointer}

.menuhint{border-top:1px solid var(--sx-border-subtle);margin-top:6px;padding:7px 6px 2px;
  font-size:11px;color:var(--sx-text-disabled);line-height:1.5;white-space:normal}
.pop h4{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--sx-text-disabled)}
.pop .prow{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:2px;font-size:12px;width:100%;text-align:left;cursor:pointer}
.pop .prow:hover{background:var(--sx-surface-hover)}
.clrow{display:grid;grid-template-columns:120px 1fr auto;gap:10px;padding:5px 10px;border-bottom:1px solid var(--sx-border-subtle);
  align-items:center;font-size:12px;width:100%;text-align:left}
.clrow:hover{background:var(--sx-surface-hover)}
.clrow .col{color:var(--sx-text-secondary);font-family:var(--sx-font-mono);font-size:11px}
.clrow .chg{font-family:var(--sx-font-mono);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.clrow .chg .old{color:var(--sx-text-disabled);text-decoration:line-through}
.clrow .chg .new{color:var(--sx-text-warning);font-weight:600}
.hint{font-size:12px;color:var(--sx-text-disabled);line-height:1.5}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:980px){
  .rail{position:absolute;left:0;top:0;bottom:0;z-index:30;box-shadow:var(--sx-shadow-layer)}
  .brand span.t{display:none}
}
</style>

<div id="app">
  <header class="topbar">
    <div class="brand"><i class="mark"></i><span class="t">SAITEX</span><span class="sep">/</span></div>
    <button class="filechip" id="filechip" title="Open a different workbook"><span class="fname">No file</span></button>
    <button class="btn" id="openbtn" title="Read an .xlsx master plan from this computer">Open workbook</button>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="spacer"></div>
    <div class="search"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="MO, style, buyer, fabric…" autocomplete="off"></div>
    <button class="btn icon" id="undo" title="Undo (Ctrl+Z)" disabled>&#8630;</button>
    <button class="btn icon" id="redo" title="Redo (Ctrl+Shift+Z)" disabled>&#8631;</button>
    <button class="btn" id="exportbtn" title="Write the edits into the workbook and download it">Export<span class="editcount hidden" id="editcount">0</span></button>
    <button class="btn icon" id="themebtn" title="Switch theme" aria-label="Switch theme">◐</button>
  </header>
  <div class="main">
    <aside class="rail" id="rail"></aside>
    <div class="viewwrap">
      <div class="viewbar" id="viewbar"></div>
      <div class="view" id="view"></div>
    </div>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Order detail" role="dialog"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="drop hide" id="drop">
  <div class="dropbox">
    <h1>Open the master production plan</h1>
    <p>Drop the workbook here, or choose the file. It is read in this browser only — nothing is uploaded, and your edits go back into the same file on export.</p>
    <button class="btn primary tall" id="pick">Choose workbook</button>
    <input type="file" id="file" accept=".xlsx,.xlsm" hidden>
    <div class="prog hidden" id="prog"><i></i></div>
    <p id="progtext" class="hint" style="margin-top:10px"></p>
  </div>
  <button class="btn" id="usesample">Open the 28 Aug sample instead</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>/*SAMPLE*/</script>
<script>/*UI*/</script>
